<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Code terminal showing Shikigami Agent SDK initialization">
  <!-- Background -->
  <rect width="1200" height="675" fill="#111111"/>
  <!-- Terminal window frame -->
  <rect x="60" y="60" width="1080" height="555" rx="4" fill="#000000" stroke="#262626" stroke-width="1"/>
  <!-- Terminal title bar -->
  <rect x="60" y="60" width="1080" height="36" rx="4" fill="#1a1a1a"/>
  <rect x="60" y="80" width="1080" height="16" fill="#1a1a1a"/>
  <!-- Traffic lights -->
  <circle cx="92" cy="78" r="6" fill="#3d3d3d"/>
  <circle cx="114" cy="78" r="6" fill="#3d3d3d"/>
  <circle cx="136" cy="78" r="6" fill="#3d3d3d"/>
  <!-- Title -->
  <text x="600" y="83" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#6b6b6b">shikigami-agent-sdk — terminal</text>
  <!-- Code content area -->
  <!-- Line 1: import -->
  <text x="96" y="130" font-family="IBM Plex Mono, monospace" font-size="13" fill="#6b6b6b">// Shikigami Agent SDK — lean TypeScript agent harness</text>
  <text x="96" y="158" font-family="IBM Plex Mono, monospace" font-size="13" fill="#9c9c9c">import</text>
  <text x="152" y="158" font-family="IBM Plex Mono, monospace" font-size="13" fill="#ffffff">{ Agent, withMemory, withGuardrails }</text>
  <text x="448" y="158" font-family="IBM Plex Mono, monospace" font-size="13" fill="#9c9c9c">from</text>
  <text x="488" y="158" font-family="IBM Plex Mono, monospace" font-size="13" fill="#9c9c9c">'shikigami'</text>
  <!-- Line 3: blank -->
  <!-- Line 4: const agent -->
  <text x="96" y="200" font-family="IBM Plex Mono, monospace" font-size="13" fill="#9c9c9c">const</text>
  <text x="136" y="200" font-family="IBM Plex Mono, monospace" font-size="13" fill="#ffffff">agent</text>
  <text x="178" y="200" font-family="IBM Plex Mono, monospace" font-size="13" fill="#9c9c9c">=</text>
  <text x="194" y="200" font-family="IBM Plex Mono, monospace" font-size="13" fill="#ffffff">new Agent({</text>
  <!-- Line 5: memory -->
  <text x="120" y="228" font-family="IBM Plex Mono, monospace" font-size="13" fill="#9c9c9c">  memory:</text>
  <text x="190" y="228" font-family="IBM Plex Mono, monospace" font-size="13" fill="#ffffff">withMemory({ strategy:</text>
  <text x="378" y="228" font-family="IBM Plex Mono, monospace" font-size="13" fill="#9c9c9c">'sliding-window'</text>
  <text x="510" y="228" font-family="IBM Plex Mono, monospace" font-size="13" fill="#ffffff">}),</text>
  <!-- Line 6: guardrails -->
  <text x="120" y="256" font-family="IBM Plex Mono, monospace" font-size="13" fill="#9c9c9c">  guardrails:</text>
  <text x="208" y="256" font-family="IBM Plex Mono, monospace" font-size="13" fill="#ffffff">withGuardrails([blockPII, blockInjection]),</text>
  <!-- Line 7: reasoning -->
  <text x="120" y="284" font-family="IBM Plex Mono, monospace" font-size="13" fill="#9c9c9c">  reasoning:</text>
  <text x="204" y="284" font-family="IBM Plex Mono, monospace" font-size="13" fill="#9c9c9c">'hyde'</text>
  <text x="244" y="284" font-family="IBM Plex Mono, monospace" font-size="13" fill="#6b6b6b">// HyDE pre-flight quality gate</text>
  <!-- Line 8: provider -->
  <text x="120" y="312" font-family="IBM Plex Mono, monospace" font-size="13" fill="#9c9c9c">  provider:</text>
  <text x="200" y="312" font-family="IBM Plex Mono, monospace" font-size="13" fill="#9c9c9c">'openai'</text>
  <text x="246" y="312" font-family="IBM Plex Mono, monospace" font-size="13" fill="#6b6b6b">// swap to openrouter, groq, or local vLLM</text>
  <!-- Line 9: close -->
  <text x="96" y="340" font-family="IBM Plex Mono, monospace" font-size="13" fill="#ffffff">})</text>
  <!-- Line 11: blank + run -->
  <text x="96" y="382" font-family="IBM Plex Mono, monospace" font-size="13" fill="#9c9c9c">const</text>
  <text x="136" y="382" font-family="IBM Plex Mono, monospace" font-size="13" fill="#ffffff">result</text>
  <text x="178" y="382" font-family="IBM Plex Mono, monospace" font-size="13" fill="#9c9c9c">=</text>
  <text x="194" y="382" font-family="IBM Plex Mono, monospace" font-size="13" fill="#9c9c9c">await</text>
  <text x="238" y="382" font-family="IBM Plex Mono, monospace" font-size="13" fill="#ffffff">agent.run(</text>
  <text x="318" y="382" font-family="IBM Plex Mono, monospace" font-size="13" fill="#9c9c9c">'Summarize this codebase and suggest improvements'</text>
  <text x="776" y="382" font-family="IBM Plex Mono, monospace" font-size="13" fill="#ffffff">)</text>
  <!-- Line 13: output marker -->
  <text x="96" y="424" font-family="IBM Plex Mono, monospace" font-size="13" fill="#6b6b6b">// → Agent runs in &lt;30min from npm install. Provider-agnostic.</text>
  <!-- Separator hairline -->
  <line x1="96" y1="450" x2="1104" y2="450" stroke="#262626" stroke-width="1"/>
  <!-- Stats row -->
  <text x="96" y="476" font-family="IBM Plex Mono, monospace" font-size="11" fill="#6b6b6b">STACK</text>
  <text x="160" y="476" font-family="IBM Plex Mono, monospace" font-size="11" fill="#9c9c9c">TypeScript · Node.js · OpenAI-compatible · Express/Next.js</text>
  <text x="96" y="500" font-family="IBM Plex Mono, monospace" font-size="11" fill="#6b6b6b">MODULES</text>
  <text x="176" y="500" font-family="IBM Plex Mono, monospace" font-size="11" fill="#9c9c9c">memory · reasoning · guardrails · tools · sub-agents · streaming</text>
  <!-- Scanline overlay effect (subtle horizontal lines) -->
  <rect width="1200" height="675" fill="url(#scanlines)" opacity="0.04"/>
  <defs>
    <pattern id="scanlines" width="1" height="3" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#ffffff"/>
    </pattern>
  </defs>
</svg>
